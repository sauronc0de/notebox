<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090e13"><title>Notebox</title><link rel="stylesheet" href="/style.css" defer></head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><symbol id="folder" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/></symbol><symbol id="briefcase" viewBox="0 0 24 24"><path d="M3 7h18v13H3zM9 7V4h6v3M3 13h18"/></symbol><symbol id="home" viewBox="0 0 24 24"><path d="m2 11 10-8 10 8M5 10v11h14V10M10 21v-7h4v7"/></symbol><symbol id="cpu" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3"/></symbol><symbol id="star" viewBox="0 0 24 24"><path d="m12 2 3 7 7 .6-5.4 5 1.6 7.4-6.2-3.8-6.2 3.8 1.6-7.4-5.4-5L9 9z"/></symbol><symbol id="book" viewBox="0 0 24 24"><path d="M12 5C9 3 5 3 2 4v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1zm0 0v15"/></symbol><symbol id="lightbulb" viewBox="0 0 24 24"><path d="M8 16c0-2-3-4-3-7a7 7 0 0 1 14 0c0 3-3 5-3 7zM8 19h8m-6 3h4"/></symbol><symbol id="gaming" viewBox="0 0 24 24"><path d="M7 8h10a4 4 0 0 1 3.9 3.1l1 5a2.5 2.5 0 0 1-4 2.4L15 16H9l-2.9 2.5a2.5 2.5 0 0 1-4-2.4l1-5A4 4 0 0 1 7 8Z"/><path d="M7 10v5m-2.5-2.5h5M16.5 11.5h.01m2 2h.01"/></symbol><symbol id="football" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m12 7 4.5 3-1.7 5h-5.6l-1.7-5L12 7ZM9 2.5 12 7l3-4.5M3 7l4.5 3-3.6 3.5M7 20.5l2.2-5.5M17 20.5 14.8 15M20.1 13.5 16.5 10 21 7"/></symbol><symbol id="barbell" viewBox="0 0 24 24"><path d="M2 10v4m3-7v10m3-9v8m8-8v8m3-9v10m3-7v4M8 12h8"/></symbol><symbol id="food" viewBox="0 0 24 24"><path d="M3 2v7a3 3 0 0 0 6 0V2M6 2v20m9-20c-2 2-3 5-3 9v2h5V2zm2 11v9"/></symbol><symbol id="gift" viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="12" rx="1"/><path d="M2 7h20v3H2zm10 0v15M12 7C7 7 5 5 6 3c1-2 5-1 6 4Zm0 0c5 0 7-2 6-4-1-2-5-1-6 4Z"/></symbol><symbol id="cat" viewBox="0 0 24 24"><path d="m3 10 1-7 5 3a10 10 0 0 1 6 0l5-3 1 7v4a9 9 0 0 1-18 0zM8 12h.01M16 12h.01m-5.5 4h3L12 18zM7 16l-5-1m5 3-5 1m15-3 5-1m-5 3 5 1"/></symbol></svg>
<div class="layout"><aside class="sidebar"><h1>notebox<span>.</span></h1><nav aria-label="Vistes"><button class="nav active" data-view="daily">☀ &nbsp; Daily</button><button class="nav" data-view="all">☷ &nbsp; All notes</button></nav><p class="hint">Un lloc tranquil per a tot allò que vols recordar.</p></aside>
<main><header class="top"><div class="mobile-brand">notebox<span>.</span></div><div id="page-title" class="eyebrow">DAILY</div><button id="new" class="primary">＋ Nova nota</button></header>
<div id="daily-view" aria-label="Llisca a esquerra o dreta per canviar de dia"><div class="daybar"><button id="prev" aria-label="Dia anterior">‹</button><div><h2 id="day-label"></h2><button id="today" class="link">Avui</button></div><button id="next" aria-label="Dia següent">›</button></div><section><h3>✦ Fixades</h3><div id="pinned-list" class="cards"></div></section><section><h3 id="date-heading"></h3><div id="daily-list" class="cards"></div></section></div>
<div id="all-view" hidden><div class="section-title"><h2>Totes les notes</h2><button type="button" id="manage-groups" class="secondary">⚙ Grups</button></div><label class="search-wrap"><span>⌕</span><input id="search" type="search" placeholder="Cerca títol, descripció o tags…" autocomplete="off"></label><div class="filters"><select id="tag-filter" aria-label="Filtra per tag"><option value="">Tots els tags</option></select><select id="group-filter" aria-label="Filtra per grup"><option value="">Tots els grups</option></select><input id="date-filter" type="date" aria-label="Filtra per data"><select id="has-date" aria-label="Filtra per presència de data"><option value="">Amb o sense data</option><option value="true">Amb data</option><option value="false">Sense data</option></select><label class="check"><input type="checkbox" id="pinned-filter"> Fixades</label><select id="sort" aria-label="Ordena"><option value="updated">Última edició</option><option value="created">Creació</option><option value="date">Data</option><option value="title">Títol</option></select></div><div id="all-list" class="cards"></div></div>
</main><button type="button" id="quick-new" class="quick-new" aria-label="Crea una nota" title="Crea una nota">＋<span>Nova nota</span></button><nav class="bottom" aria-label="Vistes mòbil"><button class="nav active" data-view="daily">☀<small>Daily</small></button><button class="nav" data-view="all">☷<small>Totes</small></button></nav></div>
<dialog id="editor"><form id="note-form"><div class="dialog-head"><h2 id="editor-title">Nova nota</h2><button type="button" id="close" class="icon-btn" aria-label="Tanca">×</button></div><label>Títol *<input id="title" maxlength="500" required placeholder="Què tens al cap?"></label><label>Descripció<textarea id="description" rows="5" placeholder="Afegeix els detalls…"></textarea></label><div class="two"><div class="date-field"><label>Data (opcional)<input id="note-date" type="date"></label><div class="date-actions"><button type="button" id="set-day" class="text-btn">Aquest dia</button><button type="button" id="clear-date" class="text-btn">Sense data ×</button></div></div><div class="group-field"><label>Grup (opcional)<select id="note-group"><option value="">Sense grup</option></select></label><button type="button" id="edit-groups" class="text-btn">Gestiona els grups</button></div></div><label>Tags (separats per comes)<input id="note-tags" list="tag-suggestions" placeholder="idea, feina…"><datalist id="tag-suggestions"></datalist></label><label class="check"><input id="note-pinned" type="checkbox"> Fixa aquesta nota</label><div class="actions"><button type="button" id="delete" class="danger" hidden>Elimina</button><button type="submit" class="primary">Desa la nota</button></div><p id="form-error" class="error" role="alert"></p></form></dialog>
<dialog id="group-dialog"><form id="group-form"><div class="dialog-head"><h2 id="group-title">Grups</h2><button type="button" id="close-group" class="icon-btn" aria-label="Tanca">×</button></div><div id="group-list" class="group-list" aria-label="Grups existents"></div><h3 id="group-form-title">Crea un grup</h3><label>Nom<input id="group-name" maxlength="100" required></label><label>Icona<div class="icon-picker"><span id="icon-preview" aria-hidden="true"></span><select id="group-icon"><option value="folder">Carpeta</option><option value="briefcase">Feina</option><option value="home">Casa</option><option value="cpu">Tecnologia</option><option value="star">Estrella</option><option value="book">Llibre</option><option value="lightbulb">Idea</option><option value="gaming">Gaming</option><option value="football">Pilota de futbol</option><option value="barbell">Barra de peses</option><option value="food">Alimentació</option><option value="gift">Regals</option><option value="cat">Gats</option></select></div></label><div class="actions"><button type="button" id="cancel-group" class="secondary" hidden>Cancel·la</button><button class="primary" id="save-group" type="submit">Crea el grup</button></div><p id="group-error" class="error" role="alert"></p></form></dialog>
<script src="/app.js" defer></script></body></html>
